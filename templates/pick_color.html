<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ChromaKey — выберите цвет фона</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Выбор цвета фона</h1>
    <p>Кликните по кадру (пипетка) — либо введите HEX вручную.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="messages">
          {% for m in messages %}
            <li>{{ m }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <div class="frame-area">
      <form method="post" action="{{ url_for('pick_color') }}">
        <input type="hidden" name="video_filename" value="{{ video_filename }}">
        <input type="hidden" name="frame_filename" value="{{ frame_filename }}">
        <!-- input type=image отправляет координаты клика как frame.x и frame.y -->
        <p>Клик по изображению ниже для выбора цвета:</p>
        <input type="image" src="{{ url_for('static', filename='uploads/' + frame_filename) }}" alt="frame" name="frame">
      </form>
    </div>

    <form method="post" action="{{ url_for('pick_color') }}">
      <input type="hidden" name="video_filename" value="{{ video_filename }}">
      <input type="hidden" name="frame_filename" value="{{ frame_filename }}">
      <label>Или введите HEX цвета (например #00FF00):
        <input type="text" name="bg_hex" placeholder="#00FF00">
      </label>
      <div class="row">
        <button type="submit" class="btn">Продолжить</button>
      </div>
    </form>

    <div class="back">
      <a href="{{ url_for('index') }}">← назад</a>
    </div>
  </div>
</body>
</html>
