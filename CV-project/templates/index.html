<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ChromaKeyer — загрузка видео</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <h1>ChromaKey Video Editor (без JS)</h1>
    <p>Шаг 1 — загрузите видео, снятое на однотонном фоне.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="messages">
          {% for m in messages %}
            <li>{{ m }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" enctype="multipart/form-data">
      <label>Выберите видео:
        <input type="file" name="video" accept="video/*" required>
      </label>
      <div class="row">
        <button type="submit" class="btn">Загрузить и выбрать цвет фона</button>
      </div>
    </form>

    <footer>
      <small>Поддерживаемые форматы: mp4, mov, avi, mkv, webm</small>
    </footer>
  </div>
</body>
</html>
